<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon (48x48 ka multiple, jaise 48/96/192 px) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Primary SEO -->
    <title>Apna Mens Wear | Men’s Fashion & Clothing Store in Indore</title>
    <meta
      name="description"
      content="Shop stylish men's clothing at Apna Mens Wear, Indore. Explore trendy shirts, t-shirts, jeans, trousers, jackets and more at affordable prices."
    />
    <meta
      name="keywords"
      content="Apna Mens Wear, mens wear Indore, men's clothing, men fashion, men's shirts, men's t-shirts, jeans for men, trousers for men, jackets for men, Choithram Square Indore"
    />
    <meta name="author" content="Apna Mens Wear" />
    <meta name="application-name" content="Apna Mens Wear" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://apnamenswear.shop/" />
    <link rel="alternate" hreflang="en-IN" href="https://apnamenswear.shop/" />
    <link rel="alternate" hreflang="x-default" href="https://apnamenswear.shop/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Local SEO -->
    <meta name="geo.region" content="IN-MP" />
    <meta name="geo.placename" content="Indore" />

    <!-- Theme -->
    <meta name="theme-color" content="#111827" />

    <!-- Structured Data: Site Name (Google me sirf "Apna Mens Wear" dikhane ke liye) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Apna Mens Wear",
        "url": "https://apnamenswear.shop/"
      }
    </script>

    <!-- Structured Data: Local Business (XXXXXXXXXX aur address apni asli details se badlein) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ClothingStore",
        "name": "Apna Mens Wear",
        "url": "https://apnamenswear.shop/",
        "logo": "https://apnamenswear.shop/favicon.png",
        "image": "https://apnamenswear.shop/og-image.png",
        "description": "Men's fashion and clothing store offering shirts, t-shirts, jeans, trousers and jackets at affordable prices.",
        "telephone": "+91-9630105490",
        "priceRange": "₹121",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Bholaram",
          "addressLocality": "Indore",
          "addressRegion": "Madhya Pradesh",
          "postalCode": "452001",
          "addressCountry": "IN"
        }
      }
    </script>

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Apna Mens Wear | Men’s Fashion & Clothing Store in Indore" />
    <meta
      property="og:description"
      content="Discover stylish men's clothing at Apna Mens Wear. Shop shirts, t-shirts, jeans, trousers, jackets and more."
    />
    <meta property="og:url" content="https://apnamenswear.shop/" />
    <meta property="og:site_name" content="Apna Mens Wear" />
    <meta property="og:image" content="https://apnamenswear.shop/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Apna Mens Wear - Men's Fashion Store" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Apna Mens Wear | Men’s Fashion & Clothing Store in Indore" />
    <meta
      name="twitter:description"
      content="Shop trendy men's clothing including shirts, t-shirts, jeans, trousers and jackets at Apna Mens Wear."
    />
    <meta name="twitter:image" content="https://apnamenswear.shop/og-image.png" />

    <!-- Mobile Browser -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Apna Mens Wear" />
  </head>

  <body>

</html>
