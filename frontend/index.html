<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =========================
         FAVICON
    ========================== -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />

    <!-- =========================
         PRIMARY SEO
    ========================== -->

    <title>
      Apna Mens Wear | Men's Fashion & Clothing Store in Indore
    </title>

    <meta
      name="description"
      content="Apna Mens Wear is a men's fashion and clothing store in Indore. Shop stylish shirts, t-shirts, jeans, trousers, jackets and more at affordable prices."
    />

    <meta
      name="author"
      content="Apna Mens Wear"
    />

    <meta
      name="application-name"
      content="Apna Mens Wear"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://apnamenswear.shop/"
    />

    <!-- Language -->
    <link
      rel="alternate"
      hreflang="en-IN"
      href="https://apnamenswear.shop/"
    />

    <link
      rel="alternate"
      hreflang="x-default"
      href="https://apnamenswear.shop/"
    />

    <!-- Sitemap -->
    <link
      rel="sitemap"
      type="application/xml"
      href="https://apnamenswear.shop/sitemap.xml"
    />

    <!-- =========================
         THEME / MOBILE
    ========================== -->

    <meta
      name="theme-color"
      content="#111827"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Apna Mens Wear"
    />

    <!-- =========================
         GOOGLE SITE NAME
    ========================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://apnamenswear.shop/#website",
        "name": "Apna Mens Wear",
        "alternateName": [
          "AMW",
          "Apna Mens Wear Indore"
        ],
        "url": "https://apnamenswear.shop/"
      }
    </script>

    <!-- =========================
         ORGANIZATION / ONLINE STORE
    ========================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "@id": "https://apnamenswear.shop/#organization",
        "name": "Apna Mens Wear",
        "alternateName": "AMW",
        "url": "https://apnamenswear.shop/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://apnamenswear.shop/favicon.png"
        },
        "image": "https://apnamenswear.shop/og-image.png",
        "description": "Apna Mens Wear is a men's fashion and clothing store offering shirts, t-shirts, jeans, trousers, jackets and more.",
        "telephone": "+91-9630105490"
      }
    </script>

    <!-- =========================
         OPEN GRAPH
    ========================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <meta
      property="og:site_name"
      content="Apna Mens Wear"
    />

    <meta
      property="og:title"
      content="Apna Mens Wear | Men's Fashion & Clothing Store in Indore"
    />

    <meta
      property="og:description"
      content="Discover stylish men's clothing at Apna Mens Wear. Shop shirts, t-shirts, jeans, trousers, jackets and more."
    />

    <meta
      property="og:url"
      content="https://apnamenswear.shop/"
    />

    <meta
      property="og:image"
      content="https://apnamenswear.shop/og-image.png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="Apna Mens Wear - Men's Fashion Store"
    />

    <!-- =========================
         TWITTER / X
    ========================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Apna Mens Wear | Men's Fashion & Clothing Store in Indore"
    />

    <meta
      name="twitter:description"
      content="Shop trendy men's clothing including shirts, t-shirts, jeans, trousers and jackets at Apna Mens Wear."
    />

    <meta
      name="twitter:image"
      content="https://apnamenswear.shop/og-image.png"
    />

    <!-- =========================
         PRECONNECT
    ========================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
  </head>

  <body>

    <!-- React Application -->
    <div id="root"></div>

    <!-- =========================
         NOSCRIPT
    ========================== -->

    <noscript>
      <div>
        <h1>Apna Mens Wear</h1>

        <p>
          Apna Mens Wear is a men's fashion and clothing store in Indore.
          Shop shirts, t-shirts, jeans, trousers, jackets and more.
        </p>

        <p>
          Please enable JavaScript to use the complete Apna Mens Wear
          online shopping experience.
        </p>
      </div>
    </noscript>

    <!-- =========================
         VITE / REACT ENTRY
    ========================== -->

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>
</html>
